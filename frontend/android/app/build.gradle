plugins { id 'com.android.application' }
def maps = new Properties()
def mapsFile = rootProject.file('maps.properties')
if (mapsFile.exists()) mapsFile.withInputStream { maps.load(it) }
android {
    namespace 'com.solara.microgrid'
    compileSdk 36
    defaultConfig {
        applicationId 'com.solara.microgrid'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
        manifestPlaceholders = [MAPS_API_KEY: maps.getProperty('MAPS_API_KEY', '')]
        buildConfigField 'String', 'MAPS_CONFIGURED', '"' + (!maps.getProperty('MAPS_API_KEY', '').isEmpty()) + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
dependencies {
    implementation 'com.google.android.gms:play-services-maps:19.2.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.3'
}
